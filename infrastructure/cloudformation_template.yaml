AWSTemplateFormatVersion: '2010-09-09'
Description: 'Infrastructure Cloud AWS Complète pour Agentic AI Fraud Detection (Kinesis, SQS, DynamoDB, S3, Lambdas, Step Functions, Bedrock, API Gateway, SNS)'

Parameters:
  Environment:
    Type: String
    Default: 'prototype'
    AllowedValues: ['prototype', 'staging', 'production']

Resources:
  # ============================================================================
  # 1. INGESTION & MESSAGERIE (F1, F6)
  # ============================================================================
  TransactionKinesisStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub 'banking-transactions-${Environment}'
      ShardCount: 1
      RetentionPeriodHours: 24
      StreamEncryption:
        EncryptionType: KMS
        KeyId: 'alias/aws/kinesis'

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'fraud-dlq-${Environment}'
      MessageRetentionPeriod: 1209600 # 14 jours

  HighRiskAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'fraud-high-risk-alerts-${Environment}'

  # ============================================================================
  # 2. STOCKAGE & BASES DE DONNÉES DYNAMODB (F8)
  # ============================================================================
  ArtifactsS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'fraud-detection-artifacts-${AWS::AccountId}-${Environment}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AlertsDynamoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'FraudDetectionAlerts-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: 'alert_id'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'alert_id'
          KeyType: 'HASH'
      SSESpecification:
        SSEEnabled: true

  TransactionsDynamoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'FraudDetectionTransactions-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: 'transaction_id'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'transaction_id'
          KeyType: 'HASH'
      SSESpecification:
        SSEEnabled: true

  ProfilesDynamoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'FraudDetectionProfiles-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: 'profile_key'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'profile_key'
          KeyType: 'HASH'
      SSESpecification:
        SSEEnabled: true

  # ============================================================================
  # 3. RÔLE IAM SERVERLESS (MOINDRE PRIVILÈGE - F9)
  # ============================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'FraudDetection-LambdaExecutionRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - states.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FraudDetectionOperations
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt AlertsDynamoTable.Arn
                  - !GetAtt TransactionsDynamoTable.Arn
                  - !GetAtt ProfilesDynamoTable.Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt DeadLetterQueue.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub '${ArtifactsS3Bucket.Arn}/*'
                  - !GetAtt ArtifactsS3Bucket.Arn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref HighRiskAlertTopic
              - Effect: Allow
                Action:
                  - kinesis:GetRecords
                  - kinesis:GetShardIterator
                  - kinesis:DescribeStream
                  - kinesis:ListShards
                Resource: !GetAtt TransactionKinesisStream.Arn

  # ============================================================================
  # 4. FONCTIONS AWS LAMBDA (F1, F3, F4, F5, F6)
  # ============================================================================
  ValidatorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'FraudDetection-Validator-${Environment}'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "message": "Validator active"}
      Timeout: 15
      Environment:
        Variables:
          DLQ_URL: !Ref DeadLetterQueue

  BehavioralLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'FraudDetection-Behavioral-${Environment}'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "message": "Behavioral active"}
      Timeout: 20
      Environment:
        Variables:
          PROFILES_TABLE: !Ref ProfilesDynamoTable

  ScorerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'FraudDetection-Scorer-${Environment}'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "message": "Scorer active"}
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TRANSACTIONS_TABLE: !Ref TransactionsDynamoTable
          MODELS_S3_BUCKET: !Ref ArtifactsS3Bucket
          INVESTIGATION_THRESHOLD: '0.20'

  InvestigatorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'FraudDetection-Investigator-${Environment}'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "message": "Investigator active"}
      Timeout: 60
      Environment:
        Variables:
          ALERTS_TABLE: !Ref AlertsDynamoTable
          SNS_TOPIC_ARN: !Ref HighRiskAlertTopic
          BEDROCK_MODEL_ID: 'anthropic.claude-3-sonnet-20240229-v1:0'

  AnalystApiLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'FraudDetection-AnalystApi-${Environment}'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "message": "Analyst API active"}
      Timeout: 20
      Environment:
        Variables:
          ALERTS_TABLE: !Ref AlertsDynamoTable
          TRANSACTIONS_TABLE: !Ref TransactionsDynamoTable

  # ============================================================================
  # 5. API GATEWAY HTTP API (F7)
  # ============================================================================
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'fraud-detection-api-${Environment}'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: ['GET', 'POST', 'OPTIONS']
        AllowHeaders: ['Content-Type', 'Authorization']

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AnalystApiLambda.Arn
      PayloadFormatVersion: '2.0'

  HttpApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: '$default'
      Target: !Sub 'integrations/${HttpApiIntegration}'

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AnalystApiLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  # ============================================================================
  # 6. OBSERVABILITÉ CLOUDWATCH (F9)
  # ============================================================================
  HighRiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'HighRiskFraudAlertsSurge-${Environment}'
      MetricName: 'HighRiskAlertCount'
      Namespace: 'BankingFraudDetection'
      Statistic: 'Sum'
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: 'GreaterThanOrEqualToThreshold'
      AlarmActions:
        - !Ref HighRiskAlertTopic

Outputs:
  ApiEndpointUrl:
    Description: 'URL HTTP publique de l API Gateway pour le Dashboard'
    Value: !GetAtt HttpApi.ApiEndpoint
  KinesisStreamName:
    Description: 'Nom du stream d ingestion Kinesis'
    Value: !Ref TransactionKinesisStream
  ArtifactsS3BucketName:
    Description: 'Nom du bucket S3 des artefacts et modèles'
    Value: !Ref ArtifactsS3Bucket
  AlertsDynamoTableName:
    Description: 'Table DynamoDB des alertes'
    Value: !Ref AlertsDynamoTable
  TransactionsDynamoTableName:
    Description: 'Table DynamoDB des transactions'
    Value: !Ref TransactionsDynamoTable
