# Configuration globale du prototype Agentic AI Fraud Detection

project:
  name: "agentic-fraud-detection-aws"
  version: "1.0.0"
  description: "Prototype académique de détection de fraude bancaire temps réel sur AWS"

data:
  raw_dir: "ieee-fraud-detection"
  processed_dir: "data/processed"
  models_dir: "data/models"
  reports_dir: "data/reports"
  train_sample_size: 100000  # Sous-échantillon représentatif pour entraînement rapide & stable
  validation_split: 0.2
  random_state: 42

detection:
  # Seuils de décision F3
  thresholds:
    low_risk: 0.20       # < 0.20 : transaction légitime (Faible risque)
    investigate: 0.60    # 0.20 - 0.60 : à surveiller / risque modéré
    high_risk: 0.80      # >= 0.80 : Risque très élevé (Alerte prioritaire)
  model_type: "lightgbm" # "lightgbm" ou "xgboost" ou "random_forest"

behavioral:
  velocity_window_hours: 24
  amount_deviation_sigma: 2.5
  max_history_per_card: 50

# Chaque valeur ci-dessous peut être surchargée par une variable d'environnement
# (voir src/config.py et .env.example). Sur AWS, le template injecte les vrais noms.

agent:
  provider: "mock" # "mock" (analyse déterministe sans frais) ou "bedrock"   [env: LLM_PROVIDER]
  model_id: "us.anthropic.claude-haiku-4-5-20251001-v1:0"                      # [env: BEDROCK_MODEL_ID]
  temperature: 0.1
  max_tokens: 700

aws:
  mode: "local" # "local" (émulation complète sans frais) ou "live" (AWS réel)  [env: APP_MODE]
  region: "us-east-1" # AWS Academy Learner Lab : us-east-1 ou us-west-2 uniquement  [env: AWS_REGION]
  s3_bucket: ""                                                                  # [env: S3_BUCKET]
  dynamodb_alerts_table: "FraudDetectionAlerts"                                  # [env: ALERTS_TABLE]
  dynamodb_transactions_table: "FraudDetectionTransactions"                      # [env: TRANSACTIONS_TABLE]
  dynamodb_card_history_table: "FraudDetectionCardHistory"                       # [env: CARD_HISTORY_TABLE]
  kinesis_stream_name: "banking-transactions-stream"                             # [env: KINESIS_STREAM]
  metrics_namespace: "BankingFraudDetection"                                     # [env: METRICS_NAMESPACE]
